# env_test -- the ONE environment both halves of the study run in.
#
#   QM9            this repo, scripts/process_and_train.py
#   validation     ../KIRBy/tests/alternative_data_noise_robustness.py
#                  (LogD, Caco-2, hERG)
#   noise          ../NoiseInject, installed from its checkout by setup.sh
#
# Build it with setup.sh, not with `conda env create` on its own: setup.sh sets
# PIP_CONSTRAINT (see pip-constraints.txt) and installs the four things that
# cannot come from a channel. Rebuild commands: RERUN_PLAN.md section 2.8i.
#
# ---------------------------------------------------------------------------
# THE RULE THIS FILE EXISTS TO KEEP: exactly ONE OpenMP threading runtime.
# ---------------------------------------------------------------------------
# With two or more loaded in one process, one library's threads deadlock or
# crash inside another's barrier, and which model dies depends on which package
# was imported first (RERUN_PLAN.md 2.8e-bis). In the full pipeline it does not
# present as a crash -- it presents as a HANG: a real run sat three hours at
# zero processor time having written one row. On the cluster that burns the
# whole allocation and the scheduler kills the task, so it writes no rows and
# no error. Neither KMP_DUPLICATE_LIB_OK=TRUE nor OMP_NUM_THREADS=1 cures it.
#
# conda-forge guarantees one runtime through `_openmp_mutex`, and its
# llvm-openmp ships libgomp.so.1 and libiomp5.so as SYMLINKS to libomp.so, so
# all three names resolve to one file. A `linux-64` solve of this file gives
# `_openmp_mutex 4.5 7_kmp_llvm` and one llvm-openmp -- measured 2026-08-27.
#
# Every runtime beyond the first arrives on a PyPI wheel installed over the
# top: torch, scikit-learn, lightgbm and xgboost wheels each bundle their own
# private copy. That is why those four, and everything else compiled, are conda
# packages here and are pinned again in pip-constraints.txt so pip cannot
# quietly replace them. Anything moved from this list into the pip: block
# reopens the defect.
#
# `python scripts/check_environment.py --deep --validation` is the gate: it
# counts DISTINCT RESOLVED FILES, not library names, so two bundled copies of
# libomp are caught even though they share a name.
#
# ---------------------------------------------------------------------------
# Why there is no `channel_priority:` line
# ---------------------------------------------------------------------------
# There used to be, and it never did anything: conda's environment-file keys
# are name, dependencies, prefix, channels and variables, and everything else
# is silently ignored. `nodefaults` below is a real channel entry and is
# honoured -- it keeps the defaults channel's intel-openmp, which IS a second
# genuine runtime, out of the solve. Set strict priority on the command line:
#   conda config --env --set channel_priority strict
#
# ---------------------------------------------------------------------------
# The pins, and what they are records of
# ---------------------------------------------------------------------------
# pytorch 2.5.1, CPU build. Settled 2026-08-27. This file claimed 2.5.1 from
#   March 2025 while the cluster ran a pip wheel of 2.3.1+cu121, so it was not
#   a truthful record of what any result was produced under; setup.sh had been
#   patched down to 2.3.1 to match the machine instead of the file being fixed.
#   Resolved upward because QM9 is being regenerated and the validation sets
#   have to be re-run under the redesigned noise conditions regardless, so no
#   surviving result is invalidated by the move. CPU because no SLURM script in
#   either repo has ever asked for a GPU (zero `--gres` across all of them), so
#   the CUDA build was four gigabytes that only ever ran CPU kernels -- and its
#   libtorch_cuda.so is what made the preflight report "inconclusive" on a
#   login node instead of a verdict.
# gpytorch 1.11, not the 1.14 this file used to claim: botorch 0.10.0 pins
#   gpytorch==1.11 and pip enforced it every time, so 1.14 was never installed.
# The rest are pinned at the versions the live environment holds, so that a
#   rebuild changes the threading runtime and torch and nothing else.
name: env_test
channels:
  - conda-forge
  - nodefaults
dependencies:
  # --- interpreter ---------------------------------------------------------
  - python=3.10.16
  - pip

  # --- numerics: compiled, and every one of them a wheel that would bundle
  #     its own OpenMP runtime if it came from PyPI ---------------------------
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.2.3
  - scikit-learn=1.6.1
  - joblib=1.4.2
  - llvm-openmp

  # --- torch, CPU builds ---------------------------------------------------
  - pytorch=2.5.1=cpu*
  - torchvision=0.20.1=cpu*
  # torchaudio was here and is imported nowhere in either repo. Dropped: it
  # constrains the torch version for nothing.

  # --- models --------------------------------------------------------------
  - pytorch_geometric=2.6.1
  - gpytorch=1.11
  - botorch=0.10.0
  - lightgbm=4.4.0
  - xgboost=3.0.0
  - quantile-forest=1.4.1   # was pip; conda-forge has it for linux-64/py310,
                            # and the conda build links the same libomp as the
                            # scikit-learn it is compiled against
  - ngboost=0.5.5
  - shap=0.47.0
  - grakel=0.1.10

  # --- chemistry -----------------------------------------------------------
  - rdkit-dev=2024.3.6
  - boost-cpp

  # --- ChemBERTa and MHG-GNN ----------------------------------------------
  # MHG-GNN is loaded from the IBM/materials checkout, not a package; these are
  # what its loader imports (huggingface_hub, networkx, torch_geometric).
  - transformers=4.51.3
  - huggingface_hub=0.30.2
  - networkx=3.4.2

  # --- everything the two pipelines import at module scope ------------------
  - optuna=4.3.0
  - diskcache=5.6.3
  - requests=2.32.3         # KIRBy validation pipeline, module scope
  - lightning=2.5.1.post0   # conda-forge ships the .post0; the plain 2.5.1 pin
                            # failed the env.yml-truthfulness check
  - sympy=1.13.3
  - tqdm=4.67.1
  - typing_extensions=4.12.2
  - matplotlib-base=3.10.1
  - seaborn=0.13.2
  - pybind11
  - pybind11-global

  # --- pip: ONLY what no channel carries -----------------------------------
  # Adding a compiled package here reopens the threading defect. Check
  # conda-forge first; quantile-forest moved up out of this block for exactly
  # that reason. setup.sh sets PIP_CONSTRAINT=pip-constraints.txt so nothing
  # below can pull a different torch, scikit-learn, lightgbm, xgboost, numpy,
  # scipy, gpytorch or botorch in behind our backs -- it fails loudly instead.
  - pip:
      - gauche==0.1.6
      - torchbnn==1.2
      - torchhk==0.86.14
      - deepchem==2.8.0     # conda-forge's deepchem caps at python<3.10
      - polaris-lib==0.11.10
      # Deleted 2026-08-27, all four imported nowhere in either repo:
      #   tensorflow, jax  -- ~700 MB and tensorflow's numpy/protobuf ceiling
      #   gensim, mol2vec  -- the last trace of the deleted mol2vec
      #                       representation, a dead import at
      #                       process_and_train.py:37
      # torchcp and torchsort are NOT here: torchsort has no linux wheel and
      # must compile against the installed torch, which needs
      # --no-build-isolation, and a requirements file cannot carry that flag.
      # setup.sh installs both.
